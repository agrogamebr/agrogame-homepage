steps:
  # Step 0: Build da imagem Docker
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/agrogame-repo/agrogame-homepage:$SHORT_SHA'
      - '--build-arg'
      - 'NEXT_PUBLIC_ENVIRONMENT=PRD'
      - '--build-arg'
      - 'NEXT_PUBLIC_API_URL=https://api.agribit.com.br'
      - '--build-arg'
      - 'NEXT_PUBLIC_APP_NAME=AgroGame HomePage'
      - '.'

  # Step 1: Push da imagem
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/agrogame-repo/agrogame-homepage:$SHORT_SHA'

  # Step 3: Deploy no Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'agrogame-homepage-prd'
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/agrogame-repo/agrogame-homepage:$SHORT_SHA'
      - '--service-account'
      - 'bitbucket-deployer@$PROJECT_ID.iam.gserviceaccount.com'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--min-instances=0'
      - '--max-instances=1'
      - '--quiet'

timeout: '3600s'

options:
  logging: CLOUD_LOGGING_ONLY

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/agrogame-repo/agrogame-homepage:$SHORT_SHA'